version: '3.9'

services:
  n8n:
    image: n8nio/n8n:1.75.2
    container_name: chatboard-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.53.5
    container_name: chatboard-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  n8n_data:
  metabase_data:
