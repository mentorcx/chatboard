version: '3.9'

services:
  app:
    build: .
    container_name: chatboard-kpi-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.53.5
    container_name: chatboard-metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

volumes:
  metabase_data:
